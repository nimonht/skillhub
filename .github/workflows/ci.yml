name: CI

on:
  push:
    branches: [main, v2]
  pull_request:

env:
  QT_VERSION: "6.8.*"

jobs:
  linux:
    name: Linux (Qt 6.8)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the v1.0.1 tag: the reference for the differential test
      - name: Qt (newer than the Qt 6.4 that Ubuntu 24.04 ships; that one is tested in its own job)
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake git pkg-config libuv1-dev libgl1-mesa-dev libxkbcommon-dev libegl1 libfontconfig1 fonts-dejavu-core
      - name: Build
        run: |
          cmake -B build -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" -DSKILLHUB_WERROR=ON
          cmake --build build -j"$(nproc)"
      - name: Version
        run: ./build/skillhub --version
      - name: C unit tests
        run: ctest --test-dir build --output-on-failure
      - name: Design token contrast (WCAG)
        run: python3 tests/contrast.py
      - name: Smoke test (offline, throw-away HOME)
        run: sh tests/smoke.sh build/skillhub
      - name: Portable CLI test (detection, links, git install/update, export/import)
        run: python3 tests/portable_smoke.py build/skillhub
      - name: Backend protocol (skillhub serve --stdio)
        run: python3 tests/rpc_smoke.py build/skillhub
      - name: Every kind of source (GitLab, git, local copies and links, hostile imports)
        run: python3 tests/sources_smoke.py build/skillhub
      - name: Reviewing updates, rollback, restore
        run: python3 tests/review_smoke.py build/skillhub
      - name: Per-agent switches and parked skills
        run: python3 tests/toggles_smoke.py build/skillhub
      - name: Project skills
        run: python3 tests/projects_smoke.py build/skillhub
      - name: Daily update and watcher, all three backends
        run: python3 tests/automation_smoke.py build/skillhub
      - name: Install / uninstall round trip (must not remove shared directories)
        run: CMAKE_PREFIX_PATH="$QT_ROOT_DIR" sh tests/install-roundtrip.sh
      - name: GUI renders headless (both themes, three sizes) with no QML errors
        run: sh tests/gui-smoke.sh build/skillhub "$RUNNER_TEMP/screens"
      - name: Skill Hub 1.0.1, the reference for the differential test
        run: |
          git worktree add "$RUNNER_TEMP/ref" v1.0.1
          mkdir "$RUNNER_TEMP/ref/build" && cd "$RUNNER_TEMP/ref/build"
          qmake ../skillhub.pro && make -j"$(nproc)"
      - name: Differential test against 1.0.1 (output, exit codes, files left behind)
        run: python3 tests/diff_vs_1_0.py "$RUNNER_TEMP/ref/build/skillhub" build/skillhub
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gui-screenshots
          path: ${{ runner.temp }}/screens

  qt64:
    name: Debian 12 (Qt 6.4, the oldest supported)
    runs-on: ubuntu-24.04
    container: debian:bookworm
    steps:
      - name: Build tools and Qt 6.4 from Debian
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends build-essential cmake git python3 ca-certificates pkg-config libuv1-dev \
            qt6-base-dev qt6-declarative-dev libgl-dev qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-templates \
            qml6-module-qtquick-shapes qml6-module-qtquick-window qml6-module-qtqml-workerscript qml6-module-qtquick-dialogs fonts-dejavu-core
      - uses: actions/checkout@v4
      - name: Build
        run: |
          cmake -B build -DSKILLHUB_WERROR=ON
          cmake --build build -j"$(nproc)"
      - name: C unit tests
        run: ctest --test-dir build --output-on-failure
      - name: Smoke test
        run: sh tests/smoke.sh build/skillhub
      - name: Portable CLI test
        run: python3 tests/portable_smoke.py build/skillhub
      - name: Backend protocol
        run: python3 tests/rpc_smoke.py build/skillhub
      - name: Sources
        run: python3 tests/sources_smoke.py build/skillhub
      - name: Reviewing updates
        run: python3 tests/review_smoke.py build/skillhub
      - name: Per-agent switches
        run: python3 tests/toggles_smoke.py build/skillhub
      - name: Project skills
        run: python3 tests/projects_smoke.py build/skillhub
      - name: Daily update and watcher
        run: python3 tests/automation_smoke.py build/skillhub
      - name: GUI renders headless on Qt 6.4
        run: sh tests/gui-smoke.sh build/skillhub "$RUNNER_TEMP/screens-qt64"

  sanitizers:
    name: C core under ASan, UBSan and TSan, and fuzzing
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang cmake git python3 pkg-config libuv1-dev
      - name: Build the command line with sanitizers (no window)
        run: |
          CC=clang cmake -B build-asan -DSKILLHUB_GUI=OFF -DSKILLHUB_SANITIZE=ON -DCMAKE_BUILD_TYPE=Debug -DSKILLHUB_WERROR=ON
          cmake --build build-asan -j"$(nproc)"
      - name: Unit tests, smoke test and portable test under sanitizers
        run: |
          ctest --test-dir build-asan --output-on-failure
          sh tests/smoke.sh build-asan/skillhub
          python3 tests/portable_smoke.py build-asan/skillhub
          python3 tests/rpc_smoke.py build-asan/skillhub
          python3 tests/sources_smoke.py build-asan/skillhub
          python3 tests/review_smoke.py build-asan/skillhub
          python3 tests/toggles_smoke.py build-asan/skillhub
          python3 tests/projects_smoke.py build-asan/skillhub
          python3 tests/automation_smoke.py build-asan/skillhub
      - name: The parallel engine under ThreadSanitizer
        run: |
          sudo sysctl vm.mmap_rnd_bits=28  # TSan cannot map its shadow memory with the runner's default ASLR entropy
          CC=clang cmake -B build-tsan -DSKILLHUB_GUI=OFF -DCMAKE_BUILD_TYPE=RelWithDebInfo -DSKILLHUB_WERROR=ON \
            -DCMAKE_C_FLAGS="-fsanitize=thread" -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread"
          cmake --build build-tsan -j"$(nproc)"
          export TSAN_OPTIONS=halt_on_error=1
          ctest --test-dir build-tsan --output-on-failure
          python3 tests/portable_smoke.py build-tsan/skillhub
          python3 tests/rpc_smoke.py build-tsan/skillhub
          python3 tests/sources_smoke.py build-tsan/skillhub
          python3 tests/review_smoke.py build-tsan/skillhub
          python3 tests/toggles_smoke.py build-tsan/skillhub
          python3 tests/projects_smoke.py build-tsan/skillhub
          python3 tests/automation_smoke.py build-tsan/skillhub
          python3 bench/bench.py build-tsan/skillhub --repos 30 --skills 5 --install-mode all
      - name: Fuzz every parser of untrusted input for a minute
        run: |
          CC=clang cmake -B build-fuzz -DSKILLHUB_GUI=OFF -DSKILLHUB_FUZZ=ON -DSKILLHUB_TESTS=OFF -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build build-fuzz -j"$(nproc)"
          for t in frontmatter import source lock rpc; do
            mkdir -p "$RUNNER_TEMP/corpus-$t"
            build-fuzz/fuzz_$t -max_total_time=60 "$RUNNER_TEMP/corpus-$t" tests/fuzz/corpus/$t
          done

  macos:
    name: macOS (universal)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true
      - name: Build
        run: |
          cmake -B build -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64" -DSKILLHUB_WERROR=ON
          cmake --build build -j"$(sysctl -n hw.ncpu)"
          lipo -archs build/skillhub-gui.app/Contents/MacOS/skillhub-gui
          lipo -archs build/skillhub-gui.app/Contents/MacOS/skillhub
      - name: Version
        run: ./build/skillhub-gui.app/Contents/MacOS/skillhub --version
      - name: C unit tests
        run: ctest --test-dir build --output-on-failure
      - name: Portable CLI test
        run: python3 tests/portable_smoke.py build/skillhub-gui.app/Contents/MacOS/skillhub
      - name: Backend protocol
        run: python3 tests/rpc_smoke.py build/skillhub-gui.app/Contents/MacOS/skillhub
      - name: Sources
        run: python3 tests/sources_smoke.py build/skillhub-gui.app/Contents/MacOS/skillhub
      - name: Reviewing updates
        run: python3 tests/review_smoke.py build/skillhub-gui.app/Contents/MacOS/skillhub
      - name: Per-agent switches
        run: python3 tests/toggles_smoke.py build/skillhub-gui.app/Contents/MacOS/skillhub
      - name: Project skills
        run: python3 tests/projects_smoke.py build/skillhub-gui.app/Contents/MacOS/skillhub
      - name: Daily update and watcher
        run: python3 tests/automation_smoke.py build/skillhub-gui.app/Contents/MacOS/skillhub
      - name: launchd takes what we give it
        run: SKILLHUB_TEST_REAL_AUTOMATION=1 python3 tests/automation_smoke.py build/skillhub-gui.app/Contents/MacOS/skillhub
      - name: GUI renders headless
        run: python3 tests/gui_launch.py build/skillhub-gui.app/Contents/MacOS/skillhub "$RUNNER_TEMP/screens"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gui-screenshots-macos
          path: ${{ runner.temp }}/screens

  windows:
    name: Windows (MSVC)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          cache: true
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Build
        shell: cmd
        run: |
          rem Ninja keeps going after a failing file (-k 0), so one run lists every compiler error
          where ninja >nul 2>&1 || choco install ninja --no-progress -y
          cmake -B build -G Ninja -DCMAKE_PREFIX_PATH="%QT_ROOT_DIR%" -DSKILLHUB_WERROR=ON
          cmake --build build -- -k 0
          dir build\*.exe
      - name: Version
        run: ./build/skillhub-cli.exe --version
        shell: bash
      - name: C unit tests
        run: ctest --test-dir build --output-on-failure
        shell: bash
      - name: Portable CLI test
        shell: bash
        run: python3 tests/portable_smoke.py build/skillhub-cli.exe
      - name: Portable CLI test again, as an account that may not create symlinks (junction fallback)
        shell: bash
        env:
          SKILLHUB_NO_SYMLINKS: "1"
        run: python3 tests/portable_smoke.py build/skillhub-cli.exe
      - name: Backend protocol, through the program without a console that the window starts
        shell: bash
        run: python3 tests/rpc_smoke.py build/skillhubw.exe
      - name: Sources
        shell: bash
        run: python3 tests/sources_smoke.py build/skillhub-cli.exe
      - name: Reviewing updates
        shell: bash
        run: python3 tests/review_smoke.py build/skillhub-cli.exe
      - name: Per-agent switches
        shell: bash
        run: python3 tests/toggles_smoke.py build/skillhub-cli.exe
      - name: Project skills
        shell: bash
        run: python3 tests/projects_smoke.py build/skillhub-cli.exe
      - name: Daily update and watcher
        shell: bash
        run: python3 tests/automation_smoke.py build/skillhub-cli.exe
      - name: Task Scheduler takes what we give it
        shell: bash
        run: SKILLHUB_TEST_REAL_AUTOMATION=1 python3 tests/automation_smoke.py build/skillhub-cli.exe
      - name: GUI renders headless
        shell: bash
        run: python3 tests/gui_launch.py build/skillhub-cli.exe "$RUNNER_TEMP/screens"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gui-screenshots-windows
          path: ${{ runner.temp }}/screens
